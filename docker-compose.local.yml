# Local Development - builds backend from source, reuses existing lc_postgres / lc_redis
#
# Prerequisites:
#   - lc_postgres and lc_redis containers running
#   - new-api database created: docker exec lc_postgres psql -U postgres -c "CREATE DATABASE \"new-api\";"
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml up -d --build  # rebuild after Go code changes
#   docker compose -f docker-compose.local.yml down
#
# Frontend dev (separate terminal):
#   cd web/default && bun install && bun run dev  # → http://localhost:3001

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev.local
    image: new-api-local:latest
    container_name: new-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://postgres:123456@host.docker.internal:5432/new-api
      - REDIS_CONN_STRING=redis://host.docker.internal:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - VIRTUAL_HOST=localhost
      - FRONTEND_BASE_URL=http://localhost:3000
    command: --log-dir /app/logs
